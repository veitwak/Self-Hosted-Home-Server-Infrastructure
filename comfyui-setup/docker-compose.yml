services:
  comfyui:
    image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
    container_name: comfyui
    ports:
      - "8188:8188"
    environment:
      - PIP_INDEX_URL=https://pypi.org/simple
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: >
      bash -lc "
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git libx11-6 &&
      python3 -m pip install --upgrade pip &&
      python3 -m pip install -r requirements.txt &&
      python3 -m pip install -r custom_nodes/ComfyUI-Manager/requirements.txt 2>/dev/null || true &&
      python3 -m pip install GitPython deepdiff &&
      export CC=gcc &&
      export CXX=g++ &&
      python3 main.py --listen 0.0.0.0 --port 8188 --enable-manager
      "
    deploy:
      resources:
        reservations:
        # needed for cuda device (nvidia and amd)
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: comfyui-proxy
    ports:
      - "8180:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - comfyui
    restart: unless-stopped

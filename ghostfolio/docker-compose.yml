services:
  ghostfolio:
    image: ghostfolio/ghostfolio:latest
    container_name: ghostfolio
    environment:
      - DATABASE_URL=postgresql://ghostfolio:YOURPASSWORD@ghostfolio-db:5432/ghostfolio?sslmode=disable
      - JWT_SECRET_KEY=YOURSTRING
      - ACCESS_TOKEN_SALT=YOURSTRING
      - NODE_ENV=production
      - PORT=3333
      - REDIS_HOST=ghostfolio-redis
      - REDIS_PORT=6379
    ports:
      - "3333:3333"
    depends_on:
      - ghostfolio-db
      - ghostfolio-redis
    restart: always

  ghostfolio-db:
    image: postgres:15-alpine
    container_name: ghostfolio-db
    environment:
      - POSTGRES_USER=ghostfolio
      - POSTGRES_PASSWORD=YOURPASSWORD
      - POSTGRES_DB=ghostfolio
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always

  ghostfolio-redis:
    image: redis:7-alpine
    container_name: ghostfolio-redis
    restart: always
